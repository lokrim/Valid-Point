[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valid-point"
version = "0.0.0"
description = "Reproducible research on sender conformity in cooperative LiDAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only the S00 notebook runner, figure export and invariant tests need these.
# The importable valid_point package keeps a standard-library runtime.
bootstrap = [
  "ipykernel>=6,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5,<6",
  "matplotlib>=3.10,<4",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
